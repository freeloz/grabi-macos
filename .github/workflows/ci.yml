# Build check on every push/PR. Release publishing is local (it needs the
# signing identity from the keychain): ./scripts/publish-release.sh
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build release
        run: swift build -c release
      - name: Test (domain + use cases)
        run: swift test
